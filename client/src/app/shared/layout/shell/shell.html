<header class="topbar">
  <a routerLink="/" class="topbar__brand">
    <span class="topbar__logo">P</span>
    Prognize
  </a>

  <nav class="topbar__nav">
    <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }"
      >Tableau de bord</a
    >
    <a routerLink="/resources" routerLinkActive="is-active">Ressources</a>
    <a routerLink="/activities" routerLinkActive="is-active">Activités</a>
    <a routerLink="/schedules" routerLinkActive="is-active">Plannings</a>
  </nav>

  @if (auth.user(); as user) {
    <div class="topbar__user">
      <div class="topbar__identity">
        <span class="topbar__name">{{ user.displayName }}</span>
        <span class="topbar__org">{{ user.organizationName }} · {{ user.role }}</span>
      </div>
      <button type="button" class="btn btn--ghost" (click)="auth.logout()">Déconnexion</button>
    </div>
  }
</header>

<main class="page">
  <router-outlet />
</main>
