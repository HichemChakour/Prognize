<div class="auth-card">
  <h1>Prognize</h1>
  <h2>Créer une organisation</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Nom de l'organisation
      <input type="text" formControlName="organizationName" placeholder="Lycée Jean Moulin" />
      @if (form.controls.organizationName.touched && form.controls.organizationName.invalid) {
        <small class="field-error">Requis.</small>
      }
    </label>

    <label>
      Votre nom
      <input type="text" formControlName="displayName" autocomplete="name" />
      @if (form.controls.displayName.touched && form.controls.displayName.invalid) {
        <small class="field-error">Requis.</small>
      }
    </label>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="field-error">Email invalide.</small>
      }
    </label>

    <label>
      Mot de passe
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="field-error">8 caractères minimum.</small>
      }
    </label>

    @if (error(); as message) {
      <p class="form-error">{{ message }}</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Création…' : 'Créer mon espace' }}
    </button>
  </form>

  <p class="switch">Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
</div>
