services:
  db:
    image: postgres:18-alpine
    container_name: prognize-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Postgres 18+ : monter /var/lib/postgresql (et PAS .../data).
      # Le data dir est versionne dans un sous-dossier (/var/lib/postgresql/18/docker).
      - prognize-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prognize-db-data:
